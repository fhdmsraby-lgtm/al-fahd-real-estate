<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Tahoma;background:#0A0A0A;color:#fff}a{color:#D4AF37}

<script>
const firebaseConfig={apiKey:"AIzaSyBzyKd-sFJzeZMQsxaJaeuA_tQxNOMRtAs",authDomain:"al-fahd-real-estate.firebaseapp.com",projectId:"al-fahd-real-estate",storageBucket:"al-fahd-real-estate.firebasestorage.app",messagingSenderId:"513435020066",appId:"1:513435020066:web:58453287f89585ce84937b",measurementId:"G-6VHP88T03V"};
let db=null; try{firebase.initializeApp(firebaseConfig); db=firebase.firestore();}catch(e){}
let all=[], tab='all', props=[];
let statuses={}; try{statuses=JSON.parse(localStorage.getItem('fahd_status')||'{}')}catch(e){}
let deleted={}; try{deleted=JSON.parse(localStorage.getItem('fahd_deleted')||'{}')}catch(e){}
const ADMIN_USER="alfahd_admin"; const ADMIN_PASS="Fahd@2026!Admin";
function doLogin(){let u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value; if(u===ADMIN_USER&&p===ADMIN_PASS){localStorage.setItem('fahd_admin','1'); showDash();}else{document.getElementById('lmsg').textContent='بيانات الدخول غير صحيحة';}}

function setTab(t,btn){tab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); document.getElementById('addPropBox').style.display=(t==='addProp'?'block':'none'); document.getElementById('q').style.display=(t==='addProp'?'none':'block'); render();}
let imgData=[];
function compressImage(file){ return new Promise(res=>{ let r=new FileReader(); r.onload=e=>{ let img=new Image(); img.onload=()=>{ let c=document.createElement('canvas'); let max=900; let w=img.width, h=img.height; if(w>max){ h=h*max/w; w=max; } c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',0.65)); }; img.src=e.target.result; }; r.readAsDataURL(file); }); }
document.getElementById('pImgFile').addEventListener('change', async e=>{ let files=[...e.target.files].slice(0,10); imgData=[]; let grid=document.getElementById('pPreviewGrid'); grid.innerHTML='جارٍ ضغط الصور...'; for(let f of files){ imgData.push(await compressImage(f)); } grid.innerHTML=imgData.map(d=>'<img src="'+d+'" style="width:70px;height:70px;object-fit:cover;border-radius:8px">').join(''); document.getElementById('pImgCount').textContent='تم اختيار '+imgData.length+' / 10 صور'; });
async function saveProp(){ let title=document.getElementById('pTitle').value.trim(), city=document.getElementById('pCity').value, address=document.getElementById('pAddress').value.trim(), type=document.getElementById('pType').value, price=document.getElementById('pPrice').value.trim(), rooms=document.getElementById('pRooms').value, baths=document.getElementById('pBaths').value, area=document.getElementById('pArea').value, details=document.getElementById('pDetails').value, imgUrl=document.getElementById('pImgUrl').value.trim(); if(!title||!city||!price){document.getElementById('pMsg').textContent='من فضلك املأ العنوان والمدينة والسعر'; return;} document.getElementById('pMsg').textContent='جارٍ نشر العقار...'; try{ await db.collection('properties').add({title, city, address, type, price, rooms, baths, area, details, image:(imgData[0]||imgUrl||''), images: imgData.length?imgData:(imgUrl?[imgUrl]:[]), createdAt: new Date().toISOString(), status:'متاح'}); document.getElementById('pMsg').textContent='تم نشر العقار ✅ ظهر في الموقع'; ['pTitle','pAddress','pPrice','pRooms','pBaths','pArea','pDetails','pImgUrl'].forEach(id=>document.getElementById(id).value=''); document.getElementById('pCity').value=''; imgData=[]; document.getElementById('pPreviewGrid').innerHTML=''; document.getElementById('pImgCount').textContent=''; document.getElementById('pImgFile').value=''; loadAll(); }catch(e){document.getElementById('pMsg').textContent='خطأ: '+e.message;} }
async function loadAll(){document.getElementById('status').textContent='جارٍ تحميل...'; all=[]; props=[]; try{ for(let col of ['investors','requests','ownerOffers','properties']){ let snap=await db.collection(col).orderBy('createdAt','desc').limit(100).get(); snap.forEach(d=>{let v=d.data(); v._col=col; v._id=d.id; if(deleted[d.id]) return; all.push(v); if(col==='properties') props.push(v);}); } document.getElementById('cInv').textContent=all.filter(x=>x._col==='investors').length; document.getElementById('cReq').textContent=all.filter(x=>x._col==='requests').length; document.getElementById('cOwn').textContent=all.filter(x=>x._col==='ownerOffers').length; document.getElementById('cProp').textContent=props.length; document.getElementById('status').textContent=all.length?('عدد العناصر: '+all.length):'لا توجد بيانات بعد'; render(); }catch(e){document.getElementById('status').textContent='تعذر التحميل: '+e.message;} }
function setStatus(id,val){statuses[id]=val; localStorage.setItem('fahd_status',JSON.stringify(statuses)); render();}
async function delReq(col,id,name){ if(!confirm('هل أنت متأكد؟ سيتم حذف: '+(name||'')+' نهائياً')) return; try{ await db.collection(col).doc(id).delete(); }catch(e){ deleted[id]=1; localStorage.setItem('fahd_deleted',JSON.stringify(deleted)); } all=all.filter(x=>x._id!==id); render(); loadAll(); }
function fmt(d){try{return new Date(d).toLocaleString('ar-EG')}catch(e){return d||''}}
function galImgs(id){ let p=all.find(x=>x._id===id); if(!p) return []; return (p.images&&p.images.length?p.images:(p.image?[p.image]:[])); }
function galShow(id,idx){ let imgs=galImgs(id); if(!imgs.length) return; idx=((idx%imgs.length)+imgs.length)%imgs.length; let main=document.getElementById('gal-'+id+'-main'); let cnt=document.getElementById('gal-'+id+'-count'); let wrap=document.getElementById('gal-'+id); if(main) main.src=imgs[idx]; if(cnt) cnt.textContent=(idx+1)+' / '+imgs.length; if(wrap) wrap.dataset.idx=idx; let dots=document.getElementById('gal-'+id+'-dots'); if(dots) dots.innerHTML=imgs.map((_,i)=>'<span style="display:inline-block;width:'+(i===idx?10:7)+'px;height:7px;border-radius:10px;background:'+(i===idx?'#D4AF37':'#555')+';margin:0 2px"></span>').join(''); }
function galNext(id,dir){ let w=document.getElementById('gal-'+id); let cur=parseInt(w?w.dataset.idx||'0':'0'); galShow(id,cur+dir); }
function galTouch(id,ev){ let el=document.getElementById('gal-'+id); if(ev.type==='touchstart'){ el.dataset.sx=ev.touches[0].clientX; } if(ev.type==='touchend'){ let dx=ev.changedTouches[0].clientX-parseFloat(el.dataset.sx||'0'); if(Math.abs(dx)>40) galNext(id, dx<0?1:-1); } }
function galleryHTML(p){ let imgs=p.images&&p.images.length?p.images:(p.image?[p.image]:[]); if(!imgs.length) return ''; let id=p._id; let dots=imgs.map((_,i)=>'<span style="display:inline-block;width:'+(i===0?10:7)+'px;height:7px;border-radius:10px;background:'+(i===0?'#D4AF37':'#555')+';margin:0 2px"></span>').join(''); return '<div id="gal-'+id+'" data-idx="0" ontouchstart="galTouch(\''+id+'\',event)" ontouchend="galTouch(\''+id+'\',event)" style="position:relative"><img id="gal-'+id+'-main" src="'+imgs[0]+'" style="width:100%;height:260px;object-fit:cover;border-radius:12px;display:block"><button onclick="galNext(\''+id+'\',-1)" style="position:absolute;top:50%;right:8px;transform:translateY(-50%);background:rgba(0,0,0,.7);color:#fff;border:1px solid #D4AF37;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer">›</button><button onclick="galNext(\''+id+'\',1)" style="position:absolute;top:50%;left:8px;transform:translateY(-50%);background:rgba(0,0,0,.7);color:#fff;border:1px solid #D4AF37;width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer">‹</button><div id="gal-'+id+'-count" style="position:absolute;bottom:34px;left:8px;background:rgba(0,0,0,.75);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px">1 / '+imgs.length+'</div><div style="position:absolute;bottom:34px;right:8px;background:rgba(0,0,0,.75);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px">📸 قلب يمين وشمال</div><div id="gal-'+id+'-dots" style="text-align:center;margin-top:6px">'+dots+'</div></div>'; }
function render(){ let q=(document.getElementById('q').value||'').toLowerCase(); let list=all.filter(x=>(tab==='all'||x._col===tab)&&JSON.stringify(x).toLowerCase().includes(q)); if(tab==='addProp'){document.getElementById('list').innerHTML=''; return;} document.getElementById('cInv').textContent=all.filter(x=>x._col==='investors').length; document.getElementById('cReq').textContent=all.filter(x=>x._col==='requests').length; document.getElementById('cOwn').textContent=all.filter(x=>x._col==='ownerOffers').length; document.getElementById('cProp').textContent=all.filter(x=>x._col==='properties').length; document.getElementById('list').innerHTML=list.length?list.map(x=>{ if(x._col==='properties'){ return '<div class="card">'+galleryHTML(x)+'<div style="display:flex;justify-content:space-between;margin-top:8px"><b>'+x.title+'</b><span style="color:#D4AF37">'+(x.type||'')+'</span></div><div style="color:#aaa;font-size:13px">📍 '+(x.city||'')+' - '+(x.address||'')+'</div><div style="color:#D4AF37;font-weight:900;font-size:20px">'+x.price+' جنيه</div><div>🛏️ '+(x.rooms||'-')+' غرف | 🛁 '+(x.baths||'-')+' حمام | 📐 '+(x.area||'-')+' م²</div><div>'+(x.details||'')+'</div><div style="color:#aaa;font-size:12px">'+fmt(x.createdAt)+' - '+(x.status||'متاح')+'</div><button class="btn red" style="margin-top:10px;width:100%" onclick="delReq(\'properties\',\''+x._id+'\',\''+(x.title||'').replace(/'/g,'')+'\')">🗑️ حذف العقار</button></div>'; } let phone=(x.phone||'').toString(); let wa=phone.replace(/[^0-9]/g,''); if(wa.startsWith('0')) wa='20'+wa.slice(1); if(wa.startsWith('20')==false&&wa.length>=9) wa='20'+wa; let title=x._col==='investors'?'💰 مستثمر':x._col==='requests'?'🏠 طلب':'🔑 عرض مالك'; let st=statuses[x._id]||'جديد'; return '<div class="card"><div style="display:flex;justify-content:space-between"><b>'+(x.name||x.owner||'بدون اسم')+'</b><span style="color:#D4AF37">'+title+'</span></div><div style="color:#aaa;font-size:13px">'+fmt(x.createdAt)+' - الحالة: '+st+'</div><div style=
