<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,Tahoma;background:#0A0A0A;color:#fff}a{color:#D4AF37}
.top{background:#000;border-bottom:2px solid #D4AF37;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.btn{padding:11px 16px;border-radius:10px;font-weight:800;border:none;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.gold{background:linear-gradient(135deg,#E8C97A,#D4AF37);color:#000}.green{background:#16a34a;color:#fff}.dark{background:#222;color:#D4AF37;border:1px solid #D4AF37}.red{background:#dc2626;color:#fff}
.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#151515;border:1px solid #2b2b2b;border-radius:16px;padding:16px;margin:12px 0}
input,select{width:100%;padding:12px;margin-top:8px;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:10px;font-size:16px}
.tab{padding:9px 14px;border-radius:20px;background:#1a1a1a;color:#fff;border:1px solid #D4AF37;cursor:pointer}.tab.on{background:#D4AF37;color:#000;font-weight:900}
.stat{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:12px;text-align:center;flex:1}
</style></head><body>
<div class="top"><div><b style="color:#D4AF37">AL FAHD REAL ESTATE</b><div style="font-size:13px">لوحة إدارة - مكتب الفهد | v2 - فيها حذف</div></div><button class="btn dark" onclick="logout()" id="logoutBtn" style="display:none">خروج</button></div>
<div class="wrap">
<div id="loginBox" class="card" style="max-width:420px;margin:30px auto;text-align:center"><h2 style="color:#D4AF37">دخول المدير</h2><input id="lu" placeholder="اسم المستخدم"><input id="lp" type="password" placeholder="كلمة المرور"><button class="btn gold" style="width:100%;margin-top:12px" onclick="doLogin()">دخول</button><p id="lmsg" style="color:#f87171"></p></div>
<div id="dash" style="display:none">
<div style="display:flex;gap:10px"><div class="stat"><div style="font-size:26px;font-weight:900;color:#D4AF37" id="cInv">-</div>مستثمرون</div><div class="stat"><div style="font-size:26px;font-weight:900;color:#D4AF37" id="cReq">-</div>طلبات</div><div class="stat"><div style="font-size:26px;font-weight:900;color:#D4AF37" id="cOwn">-</div>عروض ملاك</div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="tab on" onclick="setTab('all',this)">الكل</button><button class="tab" onclick="setTab('investors',this)">💰 المستثمرون</button><button class="tab" onclick="setTab('requests',this)">🏠 طلبات</button><button class="tab" onclick="setTab('ownerOffers',this)">🔑 عروض ملاك</button><button class="btn dark" onclick="loadAll()">🔄 تحديث</button></div>
<input id="q" placeholder="ابحث بالاسم أو التليفون أو المبلغ..." oninput="render()">
<p id="status" style="color:#aaa"></p>
<div id="list"></div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBzyKd-sFJzeZMQsxaJaeuA_tQxNOMRtAs",authDomain:"al-fahd-real-estate.firebaseapp.com",projectId:"al-fahd-real-estate",storageBucket:"al-fahd-real-estate.firebasestorage.app",messagingSenderId:"513435020066",appId:"1:513435020066:web:58453287f89585ce84937b",measurementId:"G-6VHP88T03V"};
let db=null; try{firebase.initializeApp(firebaseConfig); db=firebase.firestore();}catch(e){}
let all=[], tab='all';
let statuses={}; try{statuses=JSON.parse(localStorage.getItem('fahd_status')||'{}')}catch(e){}
let deleted={}; try{deleted=JSON.parse(localStorage.getItem('fahd_deleted')||'{}')}catch(e){}
const ADMIN_USER="alfahd_admin"; const ADMIN_PASS="Fahd@2026!Admin";
function doLogin(){let u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value; if(u===ADMIN_USER&&p===ADMIN_PASS){localStorage.setItem('fahd_admin','1'); showDash();}else{document.getElementById('lmsg').textContent='بيانات الدخول غير صحيحة';}}
function logout(){localStorage.removeItem('fahd_admin'); document.getElementById('dash').style.display='none'; document.getElementById('loginBox').style.display='block'; document.getElementById('logoutBtn').style.display='none';}
function showDash(){document.getElementById('loginBox').style.display='none'; document.getElementById('dash').style.display='block'; document.getElementById('logoutBtn').style.display='block'; loadAll();}
if(localStorage.getItem('fahd_admin')==='1') showDash();
function setTab(t,btn){tab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); render();}
async function loadAll(){document.getElementById('status').textContent='جارٍ تحميل الطلبات...'; all=[];
 try{
  for(let col of ['investors','requests','ownerOffers']){
    let snap=await db.collection(col).orderBy('createdAt','desc').limit(100).get();
    snap.forEach(d=>{let v=d.data(); v._col=col; v._id=d.id; if(!deleted[d.id]) all.push(v);});
  }
  document.getElementById('cInv').textContent=all.filter(x=>x._col==='investors').length;
  document.getElementById('cReq').textContent=all.filter(x=>x._col==='requests').length;
  document.getElementById('cOwn').textContent=all.filter(x=>x._col==='ownerOffers').length;
  document.getElementById('status').textContent=all.length?('عدد الطلبات: '+all.length):'لا توجد طلبات بعد';
  render();
 }catch(e){document.getElementById('status').textContent='تعذر التحميل: '+e.message;}
}
function setStatus(id,val){statuses[id]=val; localStorage.setItem('fahd_status',JSON.stringify(statuses)); render();}
async function delReq(col,id,name){ if(!confirm('هل أنت متأكد؟ سيتم حذف طلب: '+(name||'')+' نهائياً من لوحتك')) return;
 // 1) اخفيه من اللوحة فورا
 deleted[id]=1; localStorage.setItem('fahd_deleted',JSON.stringify(deleted));
 all=all.filter(x=>x._id!==id); render(); loadAll();
 // 2) حاول حذفه من Firebase - لو القواعد منعته، هيبقى مخفي عندك بس، واحذفه من Firebase Console
 try{ await db.collection(col).doc(id).delete(); alert('تم الحذف نهائياً ✅'); }catch(e){ alert('اتحذف من لوحتك ✅\nعشان يتحذف من Firebase كمان: افتح Firebase Console > Firestore > '+col+' > احذف المستند. أو قولي أغيّر القواعد للسماح بالحذف.'); }
}
function fmt(d){try{return new Date(d).toLocaleString('ar-EG')}catch(e){return d||''}}
function render(){
 let q=(document.getElementById('q').value||'').toLowerCase();
 let list=all.filter(x=>(tab==='all'||x._col===tab)&&JSON.stringify(x).toLowerCase().includes(q));
 document.getElementById('cInv').textContent=all.filter(x=>x._col==='investors').length;
 document.getElementById('cReq').textContent=all.filter(x=>x._col==='requests').length;
 document.getElementById('cOwn').textContent=all.filter(x=>x._col==='ownerOffers').length;
 document.getElementById('list').innerHTML=list.length?list.map(x=>{
   let phone=(x.phone||'').toString(); let wa=phone.replace(/[^0-9]/g,''); if(wa.startsWith('0')) wa='20'+wa.slice(1); if(wa.startsWith('20')==false&&wa.length>=9) wa='20'+wa;
   let title=x._col==='investors'?'💰 مستثمر':x._col==='requests'?'🏠 طلب شراء/إيجار':'🔑 عرض مالك';
   let st=statuses[x._id]||'جديد';
   return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${x.name||x.owner||'بدون اسم'}</b><span style="color:#D4AF37">${title}</span></div><div style="color:#aaa;font-size:13px">${fmt(x.createdAt)} - الحالة: ${st}</div><div style="margin-top:8px;line-height:1.8">📞 <span dir="ltr">${phone}</span><br>💰 ${x.amount||x.amount2||x.budget||x.price||''}<br>📍 ${x.area||x.type||''} ${x.duration||x.dur||''}<br>📝 ${x.notes||x.title||''}<br>خبرة: ${x.experience||x.exp||''}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a class="btn green" href="tel:+${wa}">اتصال</a><a class="btn green" href="https://wa.me/${wa}" target="_blank">واتساب</a><select style="width:auto" onchange="setStatus('${x._id}',this.value)"><option ${st==='جديد'?'selected':''}>جديد</option><option ${st==='تم التواصل'?'selected':''}>تم التواصل</option><option ${st==='متابعة'?'selected':''}>متابعة</option><option ${st==='تم الاتفاق'?'selected':''}>تم الاتفاق</option><option ${st==='مرفوض'?'selected':''}>مرفوض</option></select></div><div style="margin-top:10px"><button class="btn red" style="width:100%;padding:14px;font-size:17px" onclick="delReq('${x._col}','${x._id}','${(x.name||x.owner||'').replace(/'/g,'')}')">🗑️ حذف هذا الطلب نهائياً</button></div></div>`;
 }).join(''):'<div class="card">لا توجد نتائج مطابقة</div>';
}
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
