name: Generate static property pages and sitemap
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin.html"
      - "index.html"
      - "property.html"
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/update-sitemap.yml"
permissions:
  contents: write
concurrency:
  group: generate-static-property-pages
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch all public properties from Firestore and render static HTML
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: node scripts/generate-sitemap.mjs
      - name: Commit generated property pages and sitemap
        run: |
          if git diff --quiet -- sitemap.xml sitemap-index.xml 'sitemap-properties-*.xml' properties; then
            echo "Static property pages and sitemap are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(seo): generate static property pages [skip ci]"
          git push
