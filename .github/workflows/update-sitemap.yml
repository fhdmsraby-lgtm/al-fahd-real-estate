name: Update real-estate sitemap
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "admin.html"
      - "index.html"
      - "property.html"
      - "fahd-sitemap.js"
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/update-sitemap.yml"
permissions:
  contents: write
concurrency:
  group: update-real-estate-sitemap
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate sitemap from Firestore
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: node scripts/generate-sitemap.mjs
      - name: Commit sitemap changes
        run: |
          if git diff --quiet -- sitemap.xml sitemap-index.xml 'sitemap-properties-*.xml'; then
            echo "Sitemap is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(seo): refresh property sitemap [skip ci]"
          git push
